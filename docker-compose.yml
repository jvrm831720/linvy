services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linvy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linvy"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: ["linvy-postgres:/var/lib/postgresql/data"]
volumes:
  linvy-postgres:
